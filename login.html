<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"
        integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</head>

<body>
    <div class="container">
        <form id="loginForm">
            <h2>LOGIN</h2>
            <input type="text" placeholder="eg.johngmail.com" name="Email" id="Email">
            <input type="password" placeholder="•••••••••" name="Password" id="Password">
            <div class="checkbox-1">
                <input type="checkbox">
                <label for="remember">Remember me <span><a href="">Forgot Password?</a></span></label>
            </div>
            <button type="submit" id="loginButton"><span>Login</span></button>
            <p>Don't Have an account? <a href="register.html">Sign up</a></p>
            <p id="message"></p>
        </form>
    </div>
</body>

<script>
        $(document).ready(function () {

            $("#loginForm").validate({
                rules: {
                    Email: {
                        required: true,
                        email: true,
                        minlength: 5,
                        maxlength: 15
                    },
                    Password: {
                        required: true,
                        minlength: 6
                    },
                }, 

                messages: {
                    Email: {
                        required: "Please enter your Email",
                        email: "Please enter a valid email address",
                        minlength: "Name must be at least 5 characters long",
                        maxlength: "Name cannot exceed 10 characters"
                    },
                    Password: {
                        required: "Please provide a password",
                        minlength: "Password must be at least 11 characters long"
                    }
                },
            });
        });
</script>

<script src="js/login.js"></script>

</html>
