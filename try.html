<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        h1 {
            text-align: center;
            padding-top: 100px;
            padding-bottom: 20px;
        }

        .container {
            background-color: black;
            padding: 25px;
            border-radius: 10px;
        }

        p {
            color: white;
            padding-bottom: 1px;
        }

        .button-39 {
            background-color: #000000;
            border: 1px solid rgb(209, 213, 219);
            border-radius: .5rem;
            box-sizing: border-box;
            color: #e9e9eb;
            font-family: "Inter var", ui-sans-serif, system-ui, -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            font-size: .875rem;
            font-weight: 600;
            line-height: 1.25rem;
            padding: .75rem 1rem;
            text-align: center;
            text-decoration: none #D1D5DB solid;
            text-decoration-thickness: auto;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            width: 100%;
            margin-top: 20px;
        }

        .button-39:hover {
            background-color: rgb(249, 250, 251);
        }

        .button-39:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
        }

        .button-39:focus-visible {
            box-shadow: none;
        }
    </style>
</head>

<body>
    <h1>Register</h1>
    <div class="container w-25 mx-auto">
        <p>*Name</p>
        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Name" aria-label="Username"
                aria-describedby="basic-addon1">
        </div>

        <p>*Email</p>
        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="ex.juan@gmail.com" aria-label="Username"
                aria-describedby="basic-addon1">
        </div>

        <p>*Password</p>
        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="" aria-label="Username"
                aria-describedby="basic-addon1">
        </div>

        <p>*Confirm Password</p>
        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="" aria-label="Username"
                aria-describedby="basic-addon1">
        </div>

        <button class="button-39">Register</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
